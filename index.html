        function calcularMultiRutasEquitativas() {
            if (ROL_ACTUAL !== "admin") return;

            let numRutasInput = parseInt(document.getElementById("num-repartidores").value);
            if (isNaN(numRutasInput) || numRutasInput < 1) {
                alert("Por favor introduce un número de rutas válido (mayor o igual a 1).");
                return;
            }

            const clientesDelDia = diaActivoFiltrado === "todos" ? clientes : clientes.filter(c => c.dia === diaActivoFiltrado);
            const validos = clientesDelDia.filter(c => c.lat !== null && c.lng !== null && !c.entregado);
            const sinUbicacion = clientesDelDia.filter(c => c.lat === null || c.lng === null);

            if (validos.length === 0) { alert("No hay clientes pendientes con coordenadas."); return; }

            if (numRutasInput > validos.length) {
                numRutasInput = validos.length;
                document.getElementById("num-repartidores").value = numRutasInput;
                alert(`Ajustado automáticamente a ${numRutasInput} rutas ya que solo hay esa cantidad de clientes con coordenadas pendientes.`);
            }

            rutasOptimizadasActivas = true;
            tiemposEstimadosRutas = {};
            llegadasEstimadasPorCliente = {};
            trayectosMinutosPorCliente = {};

            // ─── PASO 1: Agrupar clientes con coordenadas idénticas ──────────────────
            // Los clientes con exactamente las mismas coordenadas forman un "supercliente".
            // Todos los miembros de un grupo deben ir en la misma ruta.
            const PRECISION = 6; // decimales para comparar coords
            const mapaGrupos = {};
            validos.forEach(p => {
                const clave = `${parseFloat(p.lat).toFixed(PRECISION)}_${parseFloat(p.lng).toFixed(PRECISION)}`;
                if (!mapaGrupos[clave]) mapaGrupos[clave] = [];
                mapaGrupos[clave].push(p);
            });

            // Cada "nodo" de trabajo representa una coordenada única;
            // miembros[] contiene todos los clientes reales en esa posición.
            const nodos = Object.values(mapaGrupos).map(grupo => ({
                lat: grupo[0].lat,
                lng: grupo[0].lng,
                miembros: grupo,
                peso: grupo.length   // cuántos clientes reales ocupa
            }));

            // ─── PASO 2: K-Means geográfico con multi-restart + swap post-process ──

            function distEuclid(a, b) {
                return Math.pow(a.lat - b.lat, 2) + Math.pow(a.lng - b.lng, 2);
            }

            // Costo total: suma de distancias de cada nodo a su centroide (ponderado)
            function calcularCostoTotal(asignacion, cents) {
                let costo = 0;
                nodos.forEach((n, i) => {
                    costo += distEuclid(n, cents[asignacion[i]]) * n.peso;
                });
                return costo;
            }

            // Semillas K-Means++ deterministas desde un offset de inicio
            function elegirSemillas(k, offsetInicio) {
                let semillas = [];
                // Rotar punto de inicio para cada restart
                let primerIdx = offsetInicio % nodos.length;
                semillas.push({ lat: nodos[primerIdx].lat, lng: nodos[primerIdx].lng });

                while (semillas.length < k) {
                    // Cada siguiente semilla: el nodo con mayor distancia mínima a cualquier semilla
                    let maxMinDist = -1, mejorIdx = 0;
                    nodos.forEach((n, i) => {
                        let minDist = Math.min(...semillas.map(s => distEuclid(n, s)));
                        if (minDist > maxMinDist) { maxMinDist = minDist; mejorIdx = i; }
                    });
                    semillas.push({ lat: nodos[mejorIdx].lat, lng: nodos[mejorIdx].lng });
                }
                return semillas;
            }

            // Una corrida completa de K-Means ponderado
            function correrKMeans(k, semillas) {
                let centroides = semillas.map(s => ({ lat: s.lat, lng: s.lng }));
                let asignacion = new Array(nodos.length).fill(0);
                const MAX_ITER = 30;

                for (let iter = 0; iter < MAX_ITER; iter++) {
                    let cambio = false;
                    nodos.forEach((n, i) => {
                        let minD = Infinity, mejorC = 0;
                        centroides.forEach((c, ci) => {
                            let d = distEuclid(n, c);
                            if (d < minD) { minD = d; mejorC = ci; }
                        });
                        if (asignacion[i] !== mejorC) { asignacion[i] = mejorC; cambio = true; }
                    });
                    if (!cambio) break;

                    // Recalcular centroides ponderados
                    centroides = centroides.map((prev, ci) => {
                        let latSum = 0, lngSum = 0, pesoTotal = 0;
                        nodos.forEach((n, i) => {
                            if (asignacion[i] === ci) {
                                latSum += n.lat * n.peso;
                                lngSum += n.lng * n.peso;
                                pesoTotal += n.peso;
                            }
                        });
                        return pesoTotal === 0 ? prev : { lat: latSum / pesoTotal, lng: lngSum / pesoTotal };
                    });
                }
                return { asignacion, centroides, costo: calcularCostoTotal(asignacion, centroides) };
            }

            // Multi-restart: correr K-Means N veces con semillas distintas, conservar la mejor
            const NUM_RESTARTS = 8;
            let mejorResultado = null;

            for (let r = 0; r < NUM_RESTARTS; r++) {
                // Variar punto de inicio: primero el más lejano al depósito, luego rotar
                let offsetBase = 0;
                if (r === 0) {
                    // Semilla clásica: nodo más lejano del depósito
                    let maxD = -1;
                    nodos.forEach((n, i) => { let d = distEuclid(n, deposito); if (d > maxD) { maxD = d; offsetBase = i; } });
                } else {
                    // Semillas rotadas para explorar distintos mínimos locales
                    offsetBase = Math.floor((r * nodos.length) / NUM_RESTARTS);
                }
                const semillas = elegirSemillas(numRutasInput, offsetBase);
                const resultado = correrKMeans(numRutasInput, semillas);
                if (!mejorResultado || resultado.costo < mejorResultado.costo) {
                    mejorResultado = resultado;
                }
            }

            let asignacionNodos = mejorResultado.asignacion;
            let centroides = mejorResultado.centroides;

            // ─── PASO 3: Balanceo de clientes reales por ruta ───────────────────────
            // Calcular cuántos clientes reales tiene cada cluster tras K-Means
            const capacidadBase = Math.floor(validos.length / numRutasInput);
            const capacidadMax = capacidadBase + 1; // tolerancia de ±1 para números no divisibles

            // Construir grupos iniciales respetando la asignación K-Means
            let gruposNodos = Array.from({ length: numRutasInput }, () => []);
            nodos.forEach((n, i) => gruposNodos[asignacionNodos[i]].push(n));

            // Contar clientes reales por grupo
            function clientesEnGrupo(g) { return g.reduce((s, n) => s + n.peso, 0); }

            // Si algún cluster excede capacidadMax, mover nodos al cluster vecino más cercano
            // que tenga espacio disponible (respetando la zona geográfica lo más posible)
            let intentos = 0;
            let sobreCarga = true;
            while (sobreCarga && intentos < 50) {
                sobreCarga = false;
                intentos++;
                for (let ci = 0; ci < numRutasInput; ci++) {
                    while (clientesEnGrupo(gruposNodos[ci]) > capacidadMax) {
                        sobreCarga = true;
                        // Encontrar el nodo del grupo que esté más cerca de otro centroide con espacio
                        let mejorNodo = null, mejorIdx = -1, mejorDestino = -1, mejorDist = Infinity;
                        gruposNodos[ci].forEach((n, ni) => {
                            for (let cj = 0; cj < numRutasInput; cj++) {
                                if (cj === ci) continue;
                                if (clientesEnGrupo(gruposNodos[cj]) + n.peso > capacidadMax) continue;
                                let d = distEuclid(n, centroides[cj]);
                                if (d < mejorDist) {
                                    mejorDist = d; mejorNodo = n; mejorIdx = ni; mejorDestino = cj;
                                }
                            }
                        });
                        if (mejorNodo === null) break; // no hay destino posible, respetar zona
                        gruposNodos[ci].splice(mejorIdx, 1);
                        gruposNodos[mejorDestino].push(mejorNodo);
                    }
                }
            }

            // ─── PASO 3b: Post-proceso de intercambio (swap) ─────────────────────────
            // Recalcular centroides finales de los grupos balanceados
            function recalcularCentroide(grupo) {
                let latSum = 0, lngSum = 0, pesoTotal = 0;
                grupo.forEach(n => { latSum += n.lat * n.peso; lngSum += n.lng * n.peso; pesoTotal += n.peso; });
                return pesoTotal === 0 ? { lat: 0, lng: 0 } : { lat: latSum / pesoTotal, lng: lngSum / pesoTotal };
            }

            function costoGrupo(grupo) {
                const c = recalcularCentroide(grupo);
                return grupo.reduce((s, n) => s + distEuclid(n, c) * n.peso, 0);
            }

            // Intentar swaps entre pares de grupos: si intercambiar un nodo de A con uno de B
            // reduce el costo total sin romper el balance, hacerlo.
            let mejorado = true;
            let pasosSwap = 0;
            while (mejorado && pasosSwap < 20) {
                mejorado = false;
                pasosSwap++;
                for (let a = 0; a < numRutasInput; a++) {
                    for (let b = a + 1; b < numRutasInput; b++) {
                        const costoAntes = costoGrupo(gruposNodos[a]) + costoGrupo(gruposNodos[b]);
                        for (let ia = 0; ia < gruposNodos[a].length; ia++) {
                            for (let ib = 0; ib < gruposNodos[b].length; ib++) {
                                const na = gruposNodos[a][ia];
                                const nb = gruposNodos[b][ib];
                                // El swap es válido si el balance no se rompe (diferencia de peso ≤ 1)
                                const pesoA = clientesEnGrupo(gruposNodos[a]);
                                const pesoB = clientesEnGrupo(gruposNodos[b]);
                                const nuevoPesoA = pesoA - na.peso + nb.peso;
                                const nuevoPesoB = pesoB - nb.peso + na.peso;
                                if (Math.abs(nuevoPesoA - nuevoPesoB) > Math.abs(pesoA - pesoB) + 1) continue;
                                if (nuevoPesoA > capacidadMax + 1 || nuevoPesoB > capacidadMax + 1) continue;

                                // Simular swap
                                const grupoASwap = [...gruposNodos[a].filter((_, i) => i !== ia), nb];
                                const grupoBSwap = [...gruposNodos[b].filter((_, i) => i !== ib), na];
                                const costoDespues = costoGrupo(grupoASwap) + costoGrupo(grupoBSwap);

                                if (costoDespues < costoAntes - 1e-10) {
                                    gruposNodos[a] = grupoASwap;
                                    gruposNodos[b] = grupoBSwap;
                                    mejorado = true;
                                    break;
                                }
                            }
                            if (mejorado) break;
                        }
                        if (mejorado) break;
                    }
                    if (mejorado) break;
                }
            }

            // ─── PASO 4: Expandir nodos → clientes reales y construir rutas ─────────
            rutasEstructuradas = [];
            let listaAsignacionesPayload = [];

            gruposNodos.forEach((nodosDelGrupo, indiceDeRuta) => {
                // Aplanar nodos a clientes individuales
                let clientesDelGrupo = [];
                nodosDelGrupo.forEach(n => n.miembros.forEach(m => clientesDelGrupo.push(m)));

                let rutaOrdenada = optimizarOrdenInternoVecino(clientesDelGrupo, deposito);
                rutasEstructuradas.push(rutaOrdenada);

                // Asignar el orden fijo (#Cte) según la posición real de visita dentro de la ruta
                let ordenVisita = 0;
                rutaOrdenada.forEach(p => {
                    if (p.id === 0) return;
                    ordenVisita++;
                    p.cte = ordenVisita;
                });

                clientesDelGrupo.forEach(p => {
                    listaAsignacionesPayload.push({ id: p.id, nombre: p.nombre, ruta: `Ruta ${indiceDeRuta + 1}`, cte: p.cte });
                });
            });

            // ─── PASO 5: Clientes sin ubicación → al final de la última ruta ────────
            if (sinUbicacion.length > 0) {
                let ultimaRuta = rutasEstructuradas[rutasEstructuradas.length - 1];
                let ordenVisita = ultimaRuta.filter(p => p.id !== 0).length;
                ultimaRuta.splice(ultimaRuta.length - 1, 0, ...sinUbicacion);
                sinUbicacion.forEach(p => {
                    ordenVisita++;
                    p.cte = ordenVisita;
                    listaAsignacionesPayload.push({ id: p.id, nombre: p.nombre, ruta: `Ruta ${rutasEstructuradas.length}`, cte: p.cte });
                });
            }

            actualizarSelectoresDeRutaDinamicos();
            refrescarMapaYListasVisuales();
            trazarLineasYCalcularTiemposOSRM();

            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ accion: "guardar_rutas_masivo", asignaciones: listaAsignacionesPayload })
            }).then(() => {
                console.log("Rutas guardadas exitosamente en Google Sheets.");
            }).catch(err => console.error("Error al guardar rutas de manera masiva: ", err));
        }

        // AJUSTE CRUCIAL: El algoritmo calcula los clientes y añade de forma fija el retorno al punto de origen
        function optimizarOrdenInternoVecino(puntosAListado, puntoDeArranque) {
            let subRutaOptima = [puntoDeArranque];
            let noVisitados = [...puntosAListado];
            let nodoActual = puntoDeArranque;

            while(noVisitados.length > 0) {
                let indiceMasCercano = -1;
                let minDistancia = Infinity;
                for(let i=0; i<noVisitados.length; i++) {
                    let d = Math.pow(nodoActual.lat - noVisitados[i].lat, 2) + Math.pow(nodoActual.lng - noVisitados[i].lng, 2);
                    if(d < minDistancia) { minDistancia = d; indiceMasCercano = i; }
                }
                if(indiceMasCercano !== -1) {
                    nodoActual = noVisitados[indiceMasCercano];
                    subRutaOptima.push(nodoActual);
                    noVisitados.splice(indiceMasCercano, 1);
                }
            }
            subRutaOptima.push(deposito);

            // ── Fase 1: 2-opt — elimina cruces de tramos ──────────────────────────
            subRutaOptima = aplicarMejora2Opt(subRutaOptima);

            // ── Fase 2: Or-opt — reubica grupos de 1 y 2 puntos ──────────────────
            // Resuelve el patrón que 2-opt no detecta: puntos "atrapados" al final
            // que generan un desvío de ida y vuelta antes de cerrar el circuito.
            // Prueba mover cada punto (o par de puntos consecutivos) a todas las
            // posiciones posibles y aplica si reduce la distancia total.
            subRutaOptima = aplicarOrOpt(subRutaOptima);

            return subRutaOptima;
        }

        function distanciaEntre(a, b) {
            const dLat = a.lat - b.lat;
            const dLng = a.lng - b.lng;
            return Math.sqrt(dLat * dLat + dLng * dLng);
        }

        function distanciaTotal(ruta) {
            let d = 0;
            for (let i = 0; i < ruta.length - 1; i++) d += distanciaEntre(ruta[i], ruta[i+1]);
            return d;
        }

        function aplicarMejora2Opt(ruta) {
            const n = ruta.length;
            if (n < 4) return ruta;

            let mejorado = true;
            let intentos = 0;
            const MAX_INTENTOS = 200;

            while (mejorado && intentos < MAX_INTENTOS) {
                mejorado = false;
                intentos++;
                for (let i = 1; i < n - 2; i++) {
                    for (let j = i + 1; j < n - 1; j++) {
                        const a = ruta[i-1], b = ruta[i], c = ruta[j], d = ruta[j+1];
                        if (distanciaEntre(a,c) + distanciaEntre(b,d) < distanciaEntre(a,b) + distanciaEntre(c,d) - 1e-9) {
                            ruta = [...ruta.slice(0,i), ...ruta.slice(i,j+1).reverse(), ...ruta.slice(j+1)];
                            mejorado = true;
                        }
                    }
                }
            }
            return ruta;
        }

        function aplicarOrOpt(ruta) {
            // ruta[0] = origen, ruta[last] = depósito cierre — ambos fijos.
            // Prueba mover segmentos de tamaño 1 y 2 a cada posición posible.
            const MAX_ITER = 150;
            let iter = 0;
            let mejorado = true;

            while (mejorado && iter < MAX_ITER) {
                mejorado = false;
                iter++;
                const n = ruta.length;

                for (let segLen = 1; segLen <= 2; segLen++) {
                    for (let i = 1; i <= n - 2 - segLen; i++) {
                        // Segmento a mover: ruta[i .. i+segLen-1]
                        const seg = ruta.slice(i, i + segLen);
                        const antes  = ruta[i - 1];
                        const despues = ruta[i + segLen];

                        // Costo actual de los tramos alrededor del segmento
                        const costoRemover = distanciaEntre(antes, seg[0])
                                           + distanciaEntre(seg[segLen-1], despues)
                                           - distanciaEntre(antes, despues);

                        // Probar insertar el segmento en cada otra posición
                        for (let j = 1; j <= n - 2; j++) {
                            if (j >= i - 1 && j <= i + segLen) continue; // posición actual, saltar

                            const p = ruta[j], q = ruta[j + 1];
                            // Costo de insertar entre p y q
                            const costoInsertar = distanciaEntre(p, seg[0])
                                                + distanciaEntre(seg[segLen-1], q)
                                                - distanciaEntre(p, q);

                            if (costoInsertar < costoRemover - 1e-9) {
                                // Aplicar el movimiento
                                let nueva = ruta.filter((_, idx) => idx < i || idx >= i + segLen);
                                // Calcular nueva posición de inserción después de eliminar
                                let insertPos = j < i ? j + 1 : j + 1 - segLen;
                                nueva = [...nueva.slice(0, insertPos), ...seg, ...nueva.slice(insertPos)];
                                ruta = nueva;
                                mejorado = true;
                                break;
                            }
                        }
                        if (mejorado) break;
                    }
                    if (mejorado) break;
                }
            }
            return ruta;
        }

        function extraerMinutosTotales(textoTiempo) {
            if (!textoTiempo) return 0;
            // Busca "Total Recorrido: Xh Ym" o "Total Recorrido: Zm mins"
            const matchHM = textoTiempo.match(/Total Recorrido:\s*(\d+)h\s*(\d+)m/);
            if (matchHM) return parseInt(matchHM[1]) * 60 + parseInt(matchHM[2]);
            const matchM = textoTiempo.match(/Total Recorrido:\s*(\d+)\s*mins/);
            if (matchM) return parseInt(matchM[1]);
            return 0;
        }

		const tiempoTotal  = matchTotalHM ? matchTotalHM[1] : (matchTotalM ? matchTotalM[1] : "—");

                return { indice, nombre, totalClientes, totalMonto, tiempoTexto, tiempoTotal, minutos, color };
		


            });

            // Ordenar de mayor a menor tiempo total de recorrido
            filas.sort((a, b) => b.minutos - a.minutos);

            const totalClientesGlobal = filas.reduce((s, f) => s + f.totalClientes, 0);
            const sufijoDia = diaActivoFiltrado !== "todos" ? ` — ${diaActivoFiltrado}` : "";
            tituloModal.textContent = `📊 Resumen de Rutas${sufijoDia} — ${totalClientesGlobal} clientes`;

            const tbody = document.getElementById("resumen-tabla-body");
            tbody.innerHTML = "";
            filas.forEach(f => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>
                        <span class="badge-ruta" style="background:${f.color}"></span>
                        ${f.nombre}
                    </td>
                    <td style="text-align:center;">${f.totalClientes}</td>
                   <td style="font-size:13px; color:#444; font-weight:600;">${f.tiempoTotal || "—"}</td>
                    <td style="font-weight:bold; color:#27ae60;">$${f.totalMonto.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("modal-resumen-rutas").classList.add("abierto");
        }

        function cerrarCierreDia() {
            document.getElementById("reporte-cierre-dia").style.display = "none";
        }

        function mostrarCierreDia() {
            // Determinar subconjunto de clientes según filtros activos
            let clientesFiltrados = clientes.filter(c => c.entregado); // solo entregados
            if (diaActivoFiltrado !== "todos") {
                clientesFiltrados = clientesFiltrados.filter(c => c.dia === diaActivoFiltrado);
            }
            if (rutaActivaFiltrada !== "todas") {
                const idxRuta = parseInt(rutaActivaFiltrada);
                if (!isNaN(idxRuta) && rutasEstructuradas[idxRuta]) {
                    const idsEnRuta = new Set(rutasEstructuradas[idxRuta].filter(p => p.id !== 0).map(p => p.id));
                    clientesFiltrados = clientesFiltrados.filter(c => idsEnRuta.has(c.id));
                }
            }

            // Título y meta
            const tituloSufijo = diaActivoFiltrado !== "todos" ? ` — ${diaActivoFiltrado}` : "";
            document.getElementById("cierre-titulo").textContent = `📋 Cierre de Día${tituloSufijo}`;
            const total = clientesFiltrados.length;
            const pendientes = clientes.filter(c => !c.entregado && (diaActivoFiltrado === "todos" || c.dia === diaActivoFiltrado)).length;
            document.getElementById("cierre-meta").textContent =
                `Entregados: ${total}  |  Pendientes: ${pendientes}  |  Generado: ${new Date().toLocaleString('es-MX')}`;

            // Obtener tipos únicos de pedido (Familiar, Individual, Personalizado, etc.)
            const tiposPedido = [...new Set(clientes.map(c => (c.pedido || "Sin tipo").trim()))].filter(Boolean).sort();
            const metodos = ["Efectivo","Tarjeta","Transferencia","Pagado (Anticipado)","No pagado"];

            // ── Construir datos ──────────────────────────────────────────────────────
            // Tabla 1: Paquetes × Método Pago (cantidad)
            // Tabla 2: Paquetes × Día (cantidad)
            // Tabla 3: Ingreso Paquetes × Método Pago ($)
            // Tabla 4: Ingreso Paquetes × Día ($)

            const diasUnicos = [...new Set(clientesFiltrados.map(c => (c.dia || "Sin día").trim()))].sort();

            function buildMatriz(filas, columnas, keyFila, keyCol, clientes) {
                const m = {};
                filas.forEach(f => { m[f] = {}; columnas.forEach(c => { m[f][c] = []; }); m[f]["__total__"] = []; });
                clientes.forEach(cl => {
                    const f = (cl[keyFila] || "Sin tipo").trim();
                    const c = (cl[keyCol] || "Sin dato").trim();
                    if (m[f] && m[f][c] !== undefined) m[f][c].push(cl);
                    if (m[f]) m[f]["__total__"].push(cl);
                });
                return m;
            }

            const matrizMetodo = buildMatriz(tiposPedido, metodos, "pedido", "metodoPago", clientesFiltrados);
            const matrizDia    = buildMatriz(tiposPedido, diasUnicos, "pedido", "dia", clientesFiltrados);

            function renderTabla(titulo, filas, columnas, matrizData, valorFn, prefijo) {
                const colsTh = columnas.map(c => `<th>${c}</th>`).join("") + "<th>Total</th>";
                let rows = filas.map(fila => {
                    const celdas = columnas.map(col => {
                        const v = valorFn(matrizData[fila]?.[col] || []);
                        return `<td>${v}</td>`;
                    }).join("");
                    const tot = valorFn(matrizData[fila]?.["__total__"] || []);
                    return `<tr><td>${fila}</td>${celdas}<td>${tot}</td></tr>`;
                }).join("");

                // Fila Total
                const totCols = columnas.map(col => {
                    const acum = filas.reduce((a, f) => a.concat(matrizData[f]?.[col] || []), []);
                    return `<td>${valorFn(acum)}</td>`;
                }).join("");
                const totTotal = valorFn(clientesFiltrados.filter(c => !columnas.length || true).reduce((a,_,__)=>a, clientesFiltrados));
                // total general
                const todosAcum = filas.reduce((a, f) => a.concat(matrizData[f]?.["__total__"] || []), []);
                const totGen = valorFn(todosAcum);
                rows += `<tr class="fila-total"><td>Total</td>${totCols}<td>${totGen}</td></tr>`;

                return `
                <div class="cierre-seccion">
                    <h2>${titulo}</h2>
                    <table class="cierre-tabla">
                        <thead><tr><th>Paquetes</th>${colsTh}</tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            }

            const fmtN = arr => arr.length || "—";
            const fmtM = arr => arr.length ? `$${arr.reduce((s,c)=>s+(parseFloat(c.monto)||0),0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}` : "—";

            // Aseguramos que el Total de la sección de días solo cuente los clientes que aparecen en esa tabla
            // (puede haber días sin entregas si el filtro no los muestra)

            let html = `<div class="cierre-dos-columnas">`;
            html += renderTabla("Conteo de Paquetes por Método de Pago", tiposPedido, metodos, matrizMetodo, fmtN, "");
            html += renderTabla("Conteo de Paquetes por Día", tiposPedido, diasUnicos, matrizDia, fmtN, "");
            html += `</div>`;
            html += `<div style="margin:8px 0 20px; font-size:13px; font-weight:700; color:#1a3c5e;">Ingreso</div>`;
            html += `<div class="cierre-dos-columnas">`;
            html += renderTabla("Ingreso por Método de Pago", tiposPedido, metodos, matrizMetodo, fmtM, "$");
            html += renderTabla("Ingreso por Día", tiposPedido, diasUnicos, matrizDia, fmtM, "$");
            html += `</div>`;

            document.getElementById("cierre-contenido").innerHTML = html;
            document.getElementById("reporte-cierre-dia").style.display = "block";
            window._cierreDatos = { clientesFiltrados, tiposPedido, metodos, diasUnicos, matrizMetodo, matrizDia, diaActivoFiltrado };
        }

        function exportarCierreExcel() {
            const d = window._cierreDatos;
            if (!d) return;
            const { tiposPedido, metodos, diasUnicos, matrizMetodo, matrizDia, diaActivoFiltrado } = d;
            const sufijo = diaActivoFiltrado !== "todos" ? ` - ${diaActivoFiltrado}` : "";

            const azul   = "#1A3C5E";
            const azulCl = "#EAF1F8";
            const verde  = "#27ae60";

            const fmtN = arr => arr.length || 0;
            const fmtM = arr => arr.length
                ? arr.reduce((s,c)=>s+(parseFloat(c.monto)||0),0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})
                : "-";

            const tdStyle = `style="border:1px solid #ccc; padding:6px 10px; text-align:right;"`;
            const tdLStyle = `style="border:1px solid #ccc; padding:6px 10px; text-align:left; font-weight:600;"`;
            const thStyle = c => `style="border:1px solid #ccc; padding:7px 10px; background:${azul}; color:#fff; text-align:${c==='Paquetes'?'left':'right'};"`;
            const trTotStyle = `style="background:${azulCl}; font-weight:700;"`;

            function buildTablaHTML(titulo, filas, columnas, matrizData, valorFn) {
                const ths = [`<th ${thStyle('Paquetes')}>Paquetes</th>`,
                    ...columnas.map(c=>`<th ${thStyle(c)}>${c}</th>`),
                    `<th ${thStyle('Total')}>Total</th>`].join("");
                const rows = filas.map(f => {
                    const cds = columnas.map(col=>`<td ${tdStyle}>${valorFn(matrizData[f]?.[col]||[])}</td>`).join("");
                    const tot = valorFn(matrizData[f]?.["__total__"]||[]);
                    return `<tr><td ${tdLStyle}>${f}</td>${cds}<td ${tdStyle}>${tot}</td></tr>`;
                }).join("");
                const totCols = columnas.map(col=>{
                    const acum = filas.reduce((a,f2)=>a.concat(matrizData[f2]?.[col]||[]),[]);
                    return `<td ${tdStyle}>${valorFn(acum)}</td>`;
                }).join("");
                const todosAcum = filas.reduce((a,f2)=>a.concat(matrizData[f2]?.["__total__"]||[]),[]);
                const totGen = `<td ${tdStyle}>${valorFn(todosAcum)}</td>`;

                return `
                <p style="font-weight:700;color:${azul};font-size:13px;margin:14px 0 6px;">${titulo}</p>
                <table style="border-collapse:collapse;width:100%;font-family:Calibri,Arial;font-size:12px;margin-bottom:18px;">
                    <thead><tr>${ths}</tr></thead>
                    <tbody>
                        ${rows}
                        <tr ${trTotStyle}><td ${tdLStyle}>Total</td>${totCols}${totGen}</tr>
                    </tbody>
                </table>`;
            }

            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:x="urn:schemas-microsoft-com:office:excel"
                xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Cierre de Día</x:Name>
<x:WorksheetOptions><x:Orientation>Landscape</x:Orientation></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
</head><body style="font-family:Calibri,Arial;font-size:12px;padding:20px;">`;

            html += `<p style="font-size:16px;font-weight:700;color:${azul};margin-bottom:4px;">📋 Cierre de Día${sufijo}</p>`;
            html += `<p style="color:#666;font-size:11px;margin-bottom:16px;">Generado: ${new Date().toLocaleString('es-MX')}</p>`;

            html += `<table style="width:100%;margin-bottom:24px;"><tr>`;
            html += `<td style="width:50%;vertical-align:top;padding-right:12px;">`;
            html += buildTablaHTML("Conteo de Paquetes por Método de Pago", tiposPedido, metodos, matrizMetodo, fmtN);
            html += `</td><td style="width:50%;vertical-align:top;padding-left:12px;">`;
            html += buildTablaHTML("Conteo de Paquetes por Día", tiposPedido, diasUnicos, matrizDia, fmtN);
            html += `</td></tr></table>`;

            html += `<p style="font-weight:700;color:${verde};font-size:14px;margin:8px 0 14px;">Ingreso</p>`;
            html += `<table style="width:100%;"><tr>`;
            html += `<td style="width:50%;vertical-align:top;padding-right:12px;">`;
            html += buildTablaHTML("Ingreso por Método de Pago", tiposPedido, metodos, matrizMetodo, fmtM);
            html += `</td><td style="width:50%;vertical-align:top;padding-left:12px;">`;
            html += buildTablaHTML("Ingreso por Día", tiposPedido, diasUnicos, matrizDia, fmtM);
            html += `</td></tr></table>`;

            html += `</body></html>`;

            const blob = new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Cierre_Dia${sufijo.replace(/\s/g,'_')}.xls`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function regresarAPantallaDeRoles() {
            document.getElementById("box-seleccion-ruta-driver").style.display = "none";
            document.getElementById("role-gate-modal").style.display = "flex";
            limpiarTodoElMapa();
            document.getElementById('contenedor-de-rutas-lista').innerHTML = '';
            clientesSeleccionadosFiltro = [];
            document.getElementById("buscador-cliente-texto").value = "";
            if (intervaloSincroniaLigera) { clearInterval(intervaloSincroniaLigera); intervaloSincroniaLigera = null; }
        }

        document.getElementById("hora-salida-ruta").value = horaSalidaRuta;
        importarDatosDesdeSheets();
    </script>
    <!-- Reporte Cierre de Día -->
    <div id="reporte-cierre-dia">
        <div class="cierre-header">
            <h1 id="cierre-titulo">📋 Cierre de Día</h1>
            <div class="cierre-header-btns">
                <button class="cierre-btn-accion cierre-btn-excel" onclick="exportarCierreExcel()">⬇️ Exportar Excel</button>
                <button class="cierre-btn-accion cierre-btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
                <button class="cierre-btn-accion cierre-btn-cerrar" onclick="cerrarCierreDia()">✕</button>
            </div>
        </div>
        <div class="cierre-body">
            <p class="cierre-meta" id="cierre-meta"></p>
            <div id="cierre-contenido"></div>
        </div>
    </div>
</body>
